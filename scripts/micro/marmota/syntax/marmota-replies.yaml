filetype: marmota-replies

# The column's upper pane (marmota.lua, render). Questions and replies
# (repliesText): what you asked stands apart from what the session wrote,
# which is Markdown. Or the sessions to pick from (sessionsText): Claude
# Code's rows and Codex's each start in a color of their own, and the marked
# row is highlighted.
detect:
    filename: "^Marmota replies$"

rules:
    - include: "markdown"
    # what you asked: a line that says whom, then the question, highlighted
    # (its line starts with a no-break space)
    - identifier: "^You → .*$"
    - statusline: "^\\x{00A0}.*$"
    # the session's reply starts under its name
    - special: "^⏺ .*$"
    # between two questions
    - comment: "^─+$"
    # still awaited, and what went wrong
    - todo: "^✳ .*$"
    - error: "^⚠ .*$"
    # the sessions to pick from: the agent, what the session does
    - comment: "^Ask which session\\?$"
    - comment: "^  (listing sessions…|no session has that)$"
    - constant: "✳ Claude Code"
    - type: "◆ Codex"
    - special: "● working"
    - error: "! needs you"
    - comment: "○ idle"
    # the marked row
    - statusline: "^▶ .*$"
